<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTech - Assistência Técnica</title> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
</head>
<body>
    <div class=" container">
        <div class="row g-3 justify-content-center">              
            <div class="col-8 ">
                <h1>iTech Assistência Técnica</h1>
                <h2>Faça seu cadastro</h2>

                <form action="">
                    <label class="form-label" for="nome">Nome:</label>
                    <input class="form-control" type="text" id="nome">
                    <label class="form-label" for="email">Seu e-mail:</label>
                    <input class="form-control" type="email" name="email" id="email">
                    <label class="form-label" for="telefone">Telefone:</label>
                    <input class="form-control" type="tel" name="telefone" id="tel">
                    <label class="form-label" for="senha">Senha:</label>
                    <input class="form-control" type="password" name="senha" id="senha">
                </form>

                <div class="chek form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="checkbox" id="aceito-termos">
                    <label class="btnCadastrar form-check-label" for="aceito-termos">Li e concordo com os termos do site</label>
                </div>

                <button type="submit" class="btn btn-info">Cadastrar</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/inputmask.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/jquery.mask.min.js"></script>
    <script src="js/jquery.mask.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
